name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name : Set up Amazon Corretto JDK 25
        uses : actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and run guardrail tests
        run: ./gradlew check